<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="James McNeil - Software Engineer based in Vienna, Austria. Portfolio of professional, personal, and game jam projects." />
    <title>James McNeil - Software Engineer</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PortfolioSite.styles.css" rel="stylesheet" />
    <script>
        (function() {
            var theme = localStorage.getItem('site-theme') || 'dark';
            var color = localStorage.getItem('site-color') || 'purple';
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
            if (color && color !== 'purple') document.documentElement.setAttribute('data-color', color);
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <div class="loader">
                <div class="loader-bar"></div>
            </div>
            <p class="loader-text">Loading portfolio...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#10005;</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.themeInterop = {
            setTheme: function(theme) {
                if (theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
                localStorage.setItem('site-theme', theme);
            },
            setColor: function(color) {
                if (color && color !== 'purple') {
                    document.documentElement.setAttribute('data-color', color);
                } else {
                    document.documentElement.removeAttribute('data-color');
                }
                localStorage.setItem('site-color', color);
            },
            getTheme: function() {
                return localStorage.getItem('site-theme') || 'dark';
            },
            getColor: function() {
                return localStorage.getItem('site-color') || 'purple';
            }
        };

        window.getElementRect = function(selector) {
            var el = document.querySelector(selector);
            if (!el) return [0, 0, 0, 0];
            var r = el.getBoundingClientRect();
            return [r.left, r.top, r.width, r.height];
        };
    </script>
</body>

</html>
